apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sandbox-app
  namespace: argocd
spec:
  description: sandbox-app namespace に dev overlay を同期
  sourceRepos:
    - https://github.com/navy1634/sandbox_app.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sandbox-app
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: sandbox-app
    - group: ""
      kind: PersistentVolume
      name: sandbox-app-database-storage
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
