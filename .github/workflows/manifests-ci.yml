name: Manifests CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
    paths:
      - manifests/**
      - .github/workflows/manifests-ci.yml
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Render manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: manifests

    env:
      ENV: ${{ github.event.pull_request.head.ref == 'main' && 'prd' || 'dev' }}

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: mise setup
        uses: jdx/mise-action@v5.0.0
        with:
          working_directory: manifests

      - name: render manifests
        run: mise run render ${{ env.ENV }}
